name: tests

on: [push]

jobs:
  build:
    name: full tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v2
    - name: install uv
      uses: astral-sh/setup-uv@v4
    - name: install dependencies
      run: uv sync
    - name: run tests
      run: uv run pytest -v .
